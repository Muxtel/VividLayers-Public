<div id="teenageClassement">
    <div id="container" class="animate__animated" anim-in="animate__lightSpeedInLeft" anim-out="animate__lightSpeedOutLeft">
        <div id="titre-container" >
            <template id="Competition">
                <div class="nom" vl-content="Nom"></div>
            </template>
        </div>
        <div id="classement">
            <div id="classement-container" class="animate__animated" anim-in="animate__slideInDown" anim-out="animate__slideOutUp">

            </div>
        </div>
    </div>
