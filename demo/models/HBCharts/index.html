                <div class="hirikoIzena" vl-content="izena"></div>
                <div class="hirikoDatuak">
                    <div>
                        <div>Bozdunak</div>
                        <div class="bozdunak" vl-content="bozdunak"></div>
                    </div>
                    <div>
                        <div>Bali</div>
                        <div class="balekoak" vl-content="balekoak"></div>
                    </div>
                    <div>
                        <div>Abstenzioa</div>

    </div>
